    <script>
      (function() {
        try {
          var _nativeFetch = window.fetch;
          var _currentFetch = _nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback if property is non-configurable
        }
      })();
    </script>

    <script>
      // Register PWA Service Worker for 100% offline-first execution
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('[Safa PWA] Service Worker registered with scope:', registration.scope);
            })
            .catch(function(error) {
              console.warn('[Safa PWA] Service Worker registration encountered an issue:', error);
            });
        });
      }
    </script>
